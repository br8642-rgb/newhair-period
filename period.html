<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>뉴헤어 기간 조회</title>
<style>
:root{
  --bg:#f3f3f0; --surface:#fcfcfb; --line:#e3e2dd; --grid:#ecebe6;
  --t1:#0b0b0b; --t2:#52514e; --t3:#807f7a;
  --s1:#2a78d6; --up:#d03a39; --down:#2a78d6; --warn-bg:#fff6dd; --warn-t:#6b4a00;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#111110; --surface:#1a1a19; --line:#2e2e2b; --grid:#262624;
    --t1:#f0efec; --t2:#c3c2b7; --t3:#9a998f;
    --s1:#3987e5; --up:#e66767; --down:#5a9bf0; --warn-bg:#2b2410; --warn-t:#f0d58a;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",Pretendard,sans-serif;line-height:1.5;-webkit-text-size-adjust:100%}
.wrap{max-width:980px;margin:0 auto;padding:16px 14px 48px}
header.top{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;margin-bottom:12px}
h1{font-size:20px;margin:0}
.sub{color:var(--t2);font-size:13px;margin:2px 0 0}
a.back{display:inline-block;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--t1);text-decoration:none;font-size:14px}
a.back:hover{border-color:var(--s1)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px}
.filters label{font-size:13px;color:var(--t2)}
select{font:inherit;font-size:15px;padding:7px 8px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--t1)}
.presets{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
button.pre{font:inherit;font-size:13px;padding:7px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--t1);cursor:pointer}
button.pre:hover{border-color:var(--s1)}
button.pre[aria-pressed="true"]{background:var(--s1);border-color:var(--s1);color:#fff}
.notice{background:var(--warn-bg);color:var(--warn-t);border-radius:10px;padding:9px 12px;font-size:13px;margin-bottom:12px}
.cards{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.card h3{margin:0 0 4px;font-size:13px;font-weight:600;color:var(--t2)}
.card .v{font-size:24px;font-weight:700;letter-spacing:-.02em;word-break:keep-all}
.card .v small{font-size:13px;font-weight:500;color:var(--t2);margin-left:2px}
.card .d{font-size:12.5px;color:var(--t2);margin-top:2px;min-height:18px}
.up{color:var(--up);font-weight:600}.dn{color:var(--down);font-weight:600}.fl{color:var(--t2);font-weight:600}
section.box{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
section.box h2{font-size:15px;margin:0 0 8px}
.tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chartwrap{position:relative}
svg text{fill:var(--t2);font-size:11px}
svg .grid{stroke:var(--grid);stroke-width:1}
svg .base{stroke:var(--t3);stroke-width:1}
svg .lbl{fill:var(--t1);font-weight:600}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:12.5px;box-shadow:0 2px 8px rgba(0,0,0,.15);display:none;white-space:nowrap;z-index:5}
.tip b{font-size:15px;display:block}
.legend{font-size:12px;color:var(--t2);margin-top:6px;display:flex;flex-wrap:wrap;gap:4px 14px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:7px 8px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}
th{font-weight:600;color:var(--t2);font-size:12.5px}
tr.sum td{font-weight:700;border-top:2px solid var(--line)}
tr.ref td{color:var(--t2)}
tr.dim td{opacity:.45}
h3.sh{font-size:13.5px;margin:14px 0 6px;color:var(--t2)}
.fn{font-size:12.5px;color:var(--t2);margin:6px 0 0;padding-left:18px}
.fn li{margin:2px 0}
details summary{cursor:pointer;font-weight:600;font-size:15px}
#osCards{grid-template-columns:repeat(4,1fr)}
@media (max-width:900px){#osCards{grid-template-columns:repeat(2,1fr)}}
@media (max-width:640px){
  .cards{grid-template-columns:repeat(2,1fr)}
  .card .v{font-size:21px}
  .presets{margin-left:0}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>뉴헤어 기간 조회</h1>
      <p class="sub" id="sub"></p>
    </div>
    <a class="back" id="back" href="#" target="_blank" rel="noopener">← 보고서로 돌아가기</a>
  </header>

  <div class="filters" role="group" aria-label="기간 선택">
    <label for="m0">시작</label><select id="m0"></select>
    <label for="m1">종료</label><select id="m1"></select>
    <div class="presets" id="presets"></div>
  </div>
  <div class="notice" id="notice" hidden></div>

  <div class="cards" id="cards"></div>

  <section class="box">
    <h2 id="chtTitle">월별 추이</h2>
    <div class="tabs" id="tabs" role="tablist"></div>
    <div class="chartwrap" id="cw"><svg id="cht" role="img" aria-label="월별 추이 그래프"></svg><div class="tip" id="tip"></div></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="box">
    <h2>채널별 현황 <span style="font-weight:400;color:var(--t2);font-size:13px" id="chRange"></span></h2>
    <div class="tw"><table id="chTable"></table></div>
    <ul class="fn" id="chFn"></ul>
  </section>

  <section class="box" id="osBox">
    <h2>해외 고객 <span style="font-weight:400;color:var(--t2);font-size:13px" id="osRange"></span></h2>
    <div class="cards" id="osCards"></div>
    <h3 class="sh">채널별 해외 문의·예약</h3>
    <div class="tw"><table id="osTable"></table></div>
    <h3 class="sh">해외 내원 (과목별)</h3>
    <div class="tw"><table id="osVisit"></table></div>
    <ul class="fn" id="osFn"></ul>
  </section>

  <section class="box">
    <details open>
      <summary>월별 표</summary>
      <div class="tw" style="margin-top:8px"><table id="moTable"></table></div>
    </details>
  </section>

  <section class="box">
    <h2>보는 법</h2>
    <ul class="fn" id="notes"></ul>
  </section>
</div>

<script>

(function(){
"use strict";
var M = DATA.months, N = M.length;
var CHAN = [ // 합산에 들어가는 채널
  {k:"ph",name:"전화"},{k:"pl",name:"플친"},{k:"em",name:"이메일"},

var OSSUB = ["모발이식","헤어라인","SMP","탈모치료","검사","처방"];
var SIDE = [{k:"nv",name:"네이버"},{k:"bd",name:"게시판"}]; // 참고(전화에 포함되어 합산 제외)

function $(id){return document.getElementById(id);}
function el(tag,cls,text){var e=document.createElement(tag);if(cls)e.className=cls;if(text!=null)e.textContent=text;return e;}
function fmt(n){return Math.round(n).toLocaleString("ko-KR");}
function pct(a,b){return b>0?a/b:null;}
function pctTxt(r){return r==null?"—":Math.round(r*100)+"%";}
function won(n){
  var eok=Math.floor(n/1e8), man=Math.round((n-eok*1e8)/1e4);
  if(man>=10000){eok+=1;man-=10000;}
  if(eok>0) return eok+"억 "+man.toLocaleString("ko-KR")+"만원";
  return man.toLocaleString("ko-KR")+"만원";
}
function wonShort(n){var a=Math.abs(n);var eok=Math.floor(a/1e8),man=Math.round((a-eok*1e8)/1e4);if(man>=10000){eok++;man-=10000;}
  return eok>0?eok+"억 "+man.toLocaleString("ko-KR")+"만":man.toLocaleString("ko-KR")+"만";}

function monthVal(m,metric){

function deltaCount(cur,prev){

/* 안내 */

function renderChart(){
  var met=METRICS.filter(function(m){return m.id===st.metric;})[0];
  $("chtTitle").textContent="월별 추이 — "+met.name;
  var svg=$("cht"),cw=$("cw"),W=Math.max(300,cw.clientWidth),H=250;
  svg.setAttribute("viewBox","0 0 "+W+" "+H);svg.setAttribute("width",W);svg.setAttribute("height",H);
  while(svg.firstChild)svg.removeChild(svg.firstChild);
  var NS="http://www.w3.org/2000/svg";
  function se(tag,attrs){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);return e;}
  var L=44,R=8,T=22,Bm=28, iw=W-L-R, ih=H-T-Bm;
  var vals=M.map(function(m){return monthVal(m,met.id);});
  var mx=0;vals.forEach(function(v){if(v!=null&&v>mx)mx=v;});
  if(met.kind==="p")mx=Math.min(1,Math.max(mx*1.1,0.1));
  if(mx<=0)mx=1;
  // 눈금
  var steps=4;
  function nice(x){var p=Math.pow(10,Math.floor(Math.log(x)/Math.LN10)),f=x/p;var n=f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10;return n*p;}
  var stepV=met.kind==="p"?(mx>0.5?0.25:0.1):nice(mx/steps);
  var top=Math.ceil(mx/stepV)*stepV;
  for(var g=0;g<=top+1e-9;g+=stepV){
    var y=T+ih-(g/top)*ih;
    svg.appendChild(se("line",{x1:L,x2:W-R,y1:y,y2:y,"class":g===0?"base":"grid"}));
    var tx=se("text",{x:L-6,y:y+4,"text-anchor":"end"});
    tx.textContent=g===0?"0":met.kind==="p"?Math.round(g*100)+"%":met.kind==="w"?(g>=1e8?(g/1e8)+"억":Math.round(g/1e4)+"만"):fmt(g);
    svg.appendChild(tx);
  }
  var bw=iw/N, bar=Math.min(46,bw*0.62);
  var maxI=-1,lastI=-1;vals.forEach(function(v,i){if(v!=null){if(maxI<0||v>vals[maxI])maxI=i;lastI=i;}});
  var tip=$("tip");
  M.forEach(function(m,i){
    var v=vals[i],cx=L+bw*i+bw/2,inSel=i>=st.i0&&i<=st.i1;
    var lab=se("text",{x:cx,y:H-9,"text-anchor":"middle"});lab.textContent=m.label;if(inSel)lab.setAttribute("style","fill:var(--t1);font-weight:600");svg.appendChild(lab);
    if(v==null){var na=se("text",{x:cx,y:T+ih-6,"text-anchor":"middle"});na.textContent="없음";svg.appendChild(na);}
    else{
      var h=Math.max(1,(v/top)*ih),y=T+ih-h;
      var r=se("rect",{x:cx-bar/2,y:y,width:bar,height:h,rx:3,fill:"var(--s1)","fill-opacity":inSel?(m.partial?0.55:1):0.22});
      if(m.partial){r.setAttribute("stroke","var(--s1)");r.setAttribute("stroke-dasharray","4 3");r.setAttribute("stroke-width","1.5");}
      svg.appendChild(r);
      if(i===maxI||i===lastI){var vt=se("text",{x:cx,y:y-5,"text-anchor":"middle","class":"lbl"});vt.textContent=showVal(v,met.kind).replace("건","");svg.appendChild(vt);}
    }
    var hit=se("rect",{x:L+bw*i,y:T,width:bw,height:ih+Bm,fill:"transparent",tabindex:0,"aria-label":m.label+" "+met.name+" "+showVal(v,met.kind)});
    function show(){tip.textContent="";var b=el("b",null,showVal(v,met.kind));tip.appendChild(b);tip.appendChild(el("span",null,"2026년 "+m.label+(m.partial?" (진행 중)":"")+" · "+met.name));
      tip.style.display="block";var tw=tip.offsetWidth;var left=Math.min(Math.max(cx-tw/2,0),W-tw);tip.style.left=left+"px";tip.style.top=Math.max(0,T-6)+"px";}
    hit.addEventListener("pointerenter",show);hit.addEventListener("pointermove",show);hit.addEventListener("focus",show);
    hit.addEventListener("pointerleave",function(){tip.style.display="none";});hit.addEventListener("blur",function(){tip.style.display="none";});
    svg.appendChild(hit);
  });
  var lg=$("legend");lg.textContent="";
  var a=el("span");var i1=el("i");i1.style.background="var(--s1)";a.appendChild(i1);a.appendChild(document.createTextNode("선택한 기간"));lg.appendChild(a);
  var b=el("span");var i2=el("i");i2.style.background="var(--s1)";i2.style.opacity=".22";b.appendChild(i2);b.appendChild(document.createTextNode("그 밖의 달"));lg.appendChild(b);
  if(M.some(function(m){return m.partial;})){var c=el("span");var i3=el("i");i3.style.border="1.5px dashed var(--s1)";c.appendChild(i3);c.appendChild(document.createTextNode("진행 중인 달"));lg.appendChild(c);}
}
